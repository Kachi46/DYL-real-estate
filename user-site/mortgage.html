<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><link rel="icon" type="image/png" href="img/logo.png" /><link rel="stylesheet" href="css/styles.css" /><title>Mortgage calculator — DYL Real-Estate Services</title></head>
<body><div id="navbar-root" class="navbar"></div><main class="container info-page"><p class="eyebrow-sm">Plan your budget</p><h1>Mortgage calculator</h1><p class="info-lead">Estimate a monthly payment in naira. This is an illustration, not a lender quote.</p><section class="calculator-card"><form id="mortgage-form" class="calculator-form"><label class="field">Property price (NGN)<input required type="number" min="1" id="mortgage-price" value="50000000" /></label><label class="field">Deposit (NGN)<input required type="number" min="0" id="mortgage-deposit" value="10000000" /></label><label class="field">Annual interest rate (%)<input required type="number" min="0" step="0.01" id="mortgage-rate" value="18" /></label><label class="field">Loan term (years)<input required type="number" min="1" max="40" id="mortgage-years" value="15" /></label><button type="submit" class="btn btn-primary">Calculate payment</button></form><div id="mortgage-result" class="calculator-result" aria-live="polite"></div></section></main><footer class="footer" id="footer-root"></footer><script src="js/env.js"></script><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/util.js"></script><script src="js/connection-check.js"></script><script src="js/nav.js"></script><script>
	const formatNaira = (value) => new Intl.NumberFormat("en-NG", { style: "currency", currency: "NGN", maximumFractionDigits: 0 }).format(value);
	document.getElementById("mortgage-form").addEventListener("submit", (event) => { event.preventDefault(); const price = Number(document.getElementById("mortgage-price").value); const deposit = Number(document.getElementById("mortgage-deposit").value); const annualRate = Number(document.getElementById("mortgage-rate").value) / 100; const months = Number(document.getElementById("mortgage-years").value) * 12; const principal = price - deposit; const monthlyRate = annualRate / 12; const payment = principal <= 0 ? 0 : monthlyRate === 0 ? principal / months : principal * monthlyRate * (1 + monthlyRate) ** months / ((1 + monthlyRate) ** months - 1); document.getElementById("mortgage-result").innerHTML = `<p class="result-label">Estimated monthly payment</p><p class="result-value">${formatNaira(payment)}</p><p class="result-note">Estimated loan: ${formatNaira(Math.max(0, principal))} over ${months} months. Confirm rates and fees with a licensed lender.</p>`; });
	document.getElementById("mortgage-form").dispatchEvent(new Event("submit"));
</script></body></html>

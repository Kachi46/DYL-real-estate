<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="seal.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <title>Create account — DYL Real Estate Services</title>
</head>
<body>
  <div id="navbar-root" class="navbar"></div>

  <main class="form-page" style="max-width:540px;">
    <h1>Create your account</h1>
    <p class="subtitle">Join Nigeria's title-verified real estate platform.</p>

    <div id="register-error"></div>
    <form id="register-form">
      <div style="margin-bottom:1.25rem;">
        <label class="field" style="margin-bottom:0.5rem;font-weight:600;">Select Account Type</label>
        <input type="hidden" id="reg-user-type" value="seeker" />
        
        <div class="user-type-selector" id="user-type-cards">
          <div class="user-type-card active" data-type="seeker">
            <div class="user-type-icon">🔍</div>
            <div class="user-type-name">Property Seeker</div>
          </div>

          <div class="user-type-card" data-type="landlord">
            <div class="user-type-icon">🏠</div>
            <div class="user-type-name">Landlord</div>
          </div>

          <div class="user-type-card" data-type="agent">
            <div class="user-type-icon">💼</div>
            <div class="user-type-name">Agent</div>
          </div>

          <div class="user-type-card" data-type="developer">
            <div class="user-type-icon">🏗️</div>
            <div class="user-type-name">Developer</div>
          </div>
        </div>
      </div>

      <label class="field">
        Full name
        <input required id="reg-name" placeholder="e.g. Somto Chukwu" />
      </label>
      <label class="field">
        Email
        <input required type="email" id="reg-email" placeholder="name@example.com" />
      </label>
      <label class="field">
        Phone (optional)
        <input id="reg-phone" placeholder="e.g. 08012345678" />
      </label>
      <label class="field">
        Password
        <input required type="password" minlength="6" id="reg-password" placeholder="••••••••" />
        <span class="hint">At least 6 characters.</span>
      </label>
      <button type="submit" class="btn btn-primary btn-block" id="register-submit">Create account</button>
    </form>

    <p class="form-footer">Already have an account? <a href="login.html">Log in</a></p>
  </main>

  <footer class="footer" id="footer-root"></footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/util.js"></script>
  <script src="js/connection-check.js"></script>
  <script src="js/nav.js"></script>
  <script>
    if (Api.getToken()) window.location.href = "dashboard.html";

    // User Type selector cards interactive script
    const typeCards = document.querySelectorAll("#user-type-cards .user-type-card");
    const userTypeInput = document.getElementById("reg-user-type");

    typeCards.forEach(card => {
      card.addEventListener("click", () => {
        typeCards.forEach(c => c.classList.remove("active"));
        card.classList.add("active");
        userTypeInput.value = card.dataset.type;
      });
    });

    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("register-error");
      const submitBtn = document.getElementById("register-submit");
      errorEl.innerHTML = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Creating account…";
      try {
        const res = await Api.post("/auth/register", {
          name: document.getElementById("reg-name").value,
          email: document.getElementById("reg-email").value,
          phone: document.getElementById("reg-phone").value,
          password: document.getElementById("reg-password").value,
          user_type: userTypeInput.value,
        });
        Api.setToken(res.token);
        window.location.href = "dashboard.html";
      } catch (err) {
        errorEl.innerHTML = `<p class="alert alert-error">${Util.escapeHtml(err.message)}</p>`;
        submitBtn.disabled = false;
        submitBtn.textContent = "Create account";
      }
    });
  </script>
</body>
</html>

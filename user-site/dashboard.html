<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="seal.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <title>My Dashboard — DYL Real Estate Services</title>
</head>
<body>
  <div id="navbar-root" class="navbar"></div>

  <main class="container" style="padding-top:2.5rem;padding-bottom:4rem;">
    <h1 class="font-display" style="font-size:2rem;color:var(--forest-900);">My dashboard</h1>

    <div class="tabs">
      <button class="tab-btn active" data-tab="listings" id="tab-listings">My Listings (0)</button>
      <button class="tab-btn" data-tab="saved" id="tab-saved">Saved (0)</button>
      <button class="tab-btn" data-tab="add" id="tab-add">List a Property</button>
    </div>

    <div class="tab-panel" id="panel-listings"><p class="loading-text">Loading…</p></div>
    <div class="tab-panel" id="panel-saved" style="display:none;"></div>
    <div class="tab-panel" id="panel-add" style="display:none;"></div>
  </main>

  <footer class="footer" id="footer-root"></footer>

  <script src="js/env.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/util.js"></script>
  <script src="js/connection-check.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>

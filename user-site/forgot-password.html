<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#071510" />
  <meta name="theme-color" content="#f8f6f1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#071510" media="(prefers-color-scheme: dark)" />
  <link rel="stylesheet" href="css/styles.css" />
  <title>Forgot password — DYL Real-Estate Services</title>
</head>
<body>
  <div id="navbar-root" class="navbar"></div>
  <main class="form-page">
    <h1>Reset your password</h1>
    <p class="subtitle">Enter your email and we will send you a password reset link.</p>
    <div id="reset-message"></div>
    <form id="forgot-form">
      <label class="field">Email address<input required type="email" id="reset-email" autocomplete="email" /></label>
      <button type="submit" class="btn btn-primary btn-block" id="reset-submit">Send reset link</button>
    </form>
    <p class="form-footer"><a href="login.html">Back to log in</a></p>
  </main>
  <footer class="footer" id="footer-root"></footer>
  <script src="js/env.js"></script><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/util.js"></script><script src="js/connection-check.js"></script><script src="js/nav.js"></script>
  <script>
    document.getElementById("forgot-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = document.getElementById("reset-message");
      const submit = document.getElementById("reset-submit");
      submit.disabled = true;
      try {
        const result = await Api.post("/auth/forgot-password", { email: document.getElementById("reset-email").value });
        message.innerHTML = `<p class="alert alert-info">${Util.escapeHtml(result.message)}</p>`;
      } catch (err) {
        message.innerHTML = `<p class="alert alert-error">${Util.escapeHtml(err.message)}</p>`;
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>

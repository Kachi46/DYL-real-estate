<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#071510" />
  <meta name="theme-color" content="#f8f6f1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#071510" media="(prefers-color-scheme: dark)" />
  <link rel="stylesheet" href="css/styles.css" />
  <title>Choose a new password — DYL Real-Estate Services</title>
</head>
<body>
  <div id="navbar-root" class="navbar"></div>
  <main class="form-page">
    <h1>Choose a new password</h1>
    <p class="subtitle">Use a password with at least 6 characters.</p>
    <div id="reset-message"></div>
    <form id="reset-form">
      <label class="field">New password<input required minlength="6" type="password" id="new-password" autocomplete="new-password" /></label>
      <label class="field">Confirm new password<input required minlength="6" type="password" id="confirm-password" autocomplete="new-password" /></label>
      <button type="submit" class="btn btn-primary btn-block" id="reset-submit">Reset password</button>
    </form>
  </main>
  <footer class="footer" id="footer-root"></footer>
  <script src="js/env.js"></script><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/util.js"></script><script src="js/connection-check.js"></script><script src="js/nav.js"></script>
  <script>
    const token = Util.qs("token");
    document.getElementById("reset-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = document.getElementById("reset-message");
      const submit = document.getElementById("reset-submit");
      const password = document.getElementById("new-password").value;
      if (!token) { message.innerHTML = '<p class="alert alert-error">This reset link is missing its token.</p>'; return; }
      if (password !== document.getElementById("confirm-password").value) { message.innerHTML = '<p class="alert alert-error">New passwords do not match.</p>'; return; }
      submit.disabled = true;
      try {
        const result = await Api.post("/auth/reset-password", { token, new_password: password });
        message.innerHTML = `<p class="alert alert-info">${Util.escapeHtml(result.message)} <a href="login.html">Log in</a></p>`;
        document.getElementById("reset-form").reset();
      } catch (err) {
        message.innerHTML = `<p class="alert alert-error">${Util.escapeHtml(err.message)}</p>`;
      } finally { submit.disabled = false; }
    });
  </script>
</body>
</html>

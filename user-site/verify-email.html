<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#071510" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#071510" media="(prefers-color-scheme: dark)" />
  <link rel="stylesheet" href="css/styles.css" />
  <title>Verify your email — DYL Real-Estate Services</title>
</head>
<body>
  <div id="navbar-root" class="navbar"></div>
  <main class="form-page">
    <h1>Verifying your email…</h1>
    <div id="verify-message"></div>
  </main>
  <footer class="footer" id="footer-root"></footer>
  <script src="js/env.js"></script><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/util.js"></script><script src="js/connection-check.js"></script><script src="js/nav.js"></script>
  <script>
    const token = Util.qs("token");
    const message = document.getElementById("verify-message");

    (async () => {
      if (!token) {
        message.innerHTML = '<p class="alert alert-error">This verification link is missing its token.</p>';
        return;
      }
      try {
        const result = await Api.post("/auth/verify-email", { token });
        message.innerHTML = `<p class="alert alert-info">${Util.escapeHtml(result.message)} <a href="dashboard.html">Go to your dashboard</a></p>`;
      } catch (err) {
        message.innerHTML = `<p class="alert alert-error">${Util.escapeHtml(err.message)}</p>`;
      }
    })();
  </script>
</body>
</html>

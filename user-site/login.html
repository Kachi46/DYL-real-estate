<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="seal.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <title>Log in — DYL Real Estate Services</title>
</head>
<body>
  <div id="navbar-root" class="navbar"></div>

  <main class="form-page">
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to manage your listings and saved properties.</p>

    <div id="login-error"></div>

    <div class="social-row">
      <div id="google-signin-container" class="google-signin-container">
        <button type="button" class="btn-social" disabled title="Google sign-in isn't configured on this site yet">
          <svg class="social-icon" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 16 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4c-7.4 0-13.8 4.2-17 10.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.5-2.1 14.3-5.6l-6.6-5.6C29.6 34.6 27 35.5 24 35.5c-5.2 0-9.6-3.5-11.2-8.2l-6.6 5.1C9.9 39.6 16.4 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.3-4.1 5.8l6.6 5.6C41.6 36.7 44 30.8 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
          Google
        </button>
      </div>
    </div>
    <p class="social-coming-soon" id="google-coming-soon-note" style="text-align:center;margin-top:-0.5rem;margin-bottom:1.5rem;">Google sign-in is coming soon — use email for now.</p>

    <div class="divider-row"><span>or continue with your email</span></div>

    <form id="login-form">
      <label class="field">
        Email
        <input required type="email" id="login-email" />
      </label>
      <label class="field">
        Password
        <input required type="password" id="login-password" />
      </label>
      <button type="submit" class="btn btn-primary btn-block" id="login-submit">Log in</button>
    </form>

    <p class="form-footer"><a href="forgot-password.html">Forgot your password?</a></p>
    <p class="form-footer">New to DYL Real Estate Services? <a href="register.html">Create an account</a></p>
  </main>

  <footer class="footer" id="footer-root"></footer>

  <script src="js/env.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/util.js"></script>
  <script src="js/connection-check.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/google-auth.js"></script>
  <script>
    if (Api.getToken()) window.location.href = "dashboard.html";

    initGoogleSignIn("google-signin-container");
    if (GOOGLE_CLIENT_ID) {
      document.getElementById("google-coming-soon-note")?.remove();
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("login-error");
      const submitBtn = document.getElementById("login-submit");
      errorEl.innerHTML = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Logging in…";
      try {
        const res = await Api.post("/auth/login", {
          email: document.getElementById("login-email").value,
          password: document.getElementById("login-password").value,
        });
        Api.setToken(res.token);
        window.location.href = "dashboard.html";
      } catch (err) {
        errorEl.innerHTML = `<p class="alert alert-error">${Util.escapeHtml(err.message)}</p>`;
        submitBtn.disabled = false;
        submitBtn.textContent = "Log in";
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#071510" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#071510" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/png" href="img/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <title>Browse Listings — DYL Real-Estate Services</title>
</head>
<body>
  <div id="navbar-root" class="navbar"></div>

  <main class="container">
    <h1 class="page-title">Browse listings</h1>

    <form class="filter-bar" id="listing-filters">
      <label class="filter-field filter-field-location" for="f-q">
        <span>Location</span>
        <input type="search" id="f-q" placeholder="City, area or keyword" />
      </label>
      <label class="filter-field" for="f-state">
        <span>State</span>
        <select id="f-state">
          <option value="">All states</option>
          <option value="Enugu">Enugu</option>
          <option value="Lagos">Lagos</option>
          <option value="Abuja">Abuja</option>
          <option value="Ogun">Ogun</option>
          <option value="Oyo">Oyo</option>
          <option value="Rivers">Rivers</option>
        </select>
      </label>
      <label class="filter-field" for="f-type">
        <span>Property type</span>
        <select id="f-type">
          <option value="">All types</option>
          <option value="land">Land</option>
          <option value="residential">Residential</option>
          <option value="commercial">Commercial</option>
        </select>
      </label>
      <label class="filter-field" for="f-listing">
        <span>Listing type</span>
        <select id="f-listing">
          <option value="">Sale &amp; rent</option>
          <option value="sale">For sale</option>
          <option value="rent">For rent</option>
        </select>
      </label>
      <label class="filter-field" for="f-min-price">
        <span>Minimum price</span>
        <select id="f-min-price">
          <option value="">No minimum</option>
          <option value="1000000">₦1M</option>
          <option value="5000000">₦5M</option>
          <option value="10000000">₦10M</option>
          <option value="25000000">₦25M</option>
          <option value="50000000">₦50M</option>
          <option value="100000000">₦100M</option>
        </select>
      </label>
      <label class="filter-field" for="f-max-price">
        <span>Maximum price</span>
        <select id="f-max-price">
          <option value="">No maximum</option>
          <option value="5000000">₦5M</option>
          <option value="15000000">₦15M</option>
          <option value="30000000">₦30M</option>
          <option value="75000000">₦75M</option>
          <option value="150000000">₦150M</option>
          <option value="500000000">₦500M+</option>
        </select>
      </label>
      <label class="filter-checkbox filter-verified">
        <input type="checkbox" id="f-verified" /> Verified title only
      </label>
      <div class="filter-actions">
        <button type="submit" class="btn btn-gold">Apply filters</button>
        <button type="button" class="btn btn-outline" id="clear-filters">Clear filters</button>
      </div>
    </form>

    <div id="results">
      <p class="loading-text">Loading listings…</p>
    </div>

    <div class="pagination" id="pagination"></div>
  </main>

  <footer class="footer" id="footer-root"></footer>

  <script src="js/env.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/util.js"></script>
  <script src="js/connection-check.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/listings.js"></script>
</body>
</html>

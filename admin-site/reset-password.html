<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/styles.css" />
  <title>Choose a new admin password — DYL Real Estate Services</title>
</head>
<body>
  <div class="login-shell">
    <main class="login-card">
      <div class="brand-row">
        <img src="./img/logo.png" alt="Logo" height="32" width="32" />
        <div>
          <p class="name">DYL Real Estate Services</p>
          <p class="tag">Admin console</p>
        </div>
      </div>

      <div style="margin-top:1.5rem;">
        <h1 class="font-display" style="font-size:1.9rem; margin:0 0 .3rem; color:var(--forest-900);">Choose a new password</h1>
        <p style="color:var(--forest-500); font-size:.9rem; line-height:1.5; margin:0 0 2.25rem;">Use a password with at least 6 characters.</p>
      </div>
      <div id="reset-message"></div>
      <form id="reset-form">
        <label class="field">New password<input required minlength="6" type="password" id="new-password" autocomplete="new-password" /></label>
        <label class="field">Confirm new password<input required minlength="6" type="password" id="confirm-password" autocomplete="new-password" /></label>
        <button type="submit" class="btn btn-primary btn-block" id="reset-submit">Reset password</button>
      </form>
      <p class="form-footer"><a href="login.html">Back to log in</a></p>
    </main>
  </div>

  <script src="js/env.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/util.js"></script>
  <script>
    const token = Util.qs("token");
    const form = document.getElementById("reset-form");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = document.getElementById("reset-message");
      const submit = document.getElementById("reset-submit");
      const password = document.getElementById("new-password").value;
      if (!token) {
        message.innerHTML = '<p class="alert alert-error">This reset link is missing its token.</p>';
        return;
      }
      if (password !== document.getElementById("confirm-password").value) {
        message.innerHTML = '<p class="alert alert-error">New passwords do not match.</p>';
        return;
      }
      submit.disabled = true;
      try {
        const result = await Api.post("/auth/reset-password", { token, new_password: password });
        message.innerHTML = `<p class="alert alert-info">${Util.escapeHtml(result.message)} <a href="login.html">Log in</a></p>`;
        form.reset();
      } catch (err) {
        message.innerHTML = `<p class="alert alert-error">${Util.escapeHtml(err.message)}</p>`;
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/styles.css" />
  <title>Reset admin password — DYL Real Estate Services</title>
</head>
<body>
  <div class="login-shell">
    <main class="login-card">
      <div class="brand-row">
        <img src="./img/logo.png" alt="Logo" height="32" width="32" />
        <div>
          <p class="name">DYL Real Estate Services</p>
          <p class="tag">Admin console</p>
        </div>
      </div>

      <div style="margin-top:1.5rem;">
        <h1 class="font-display" style="font-size:1.9rem; margin:0 0 .3rem; color:var(--forest-900);">Reset your password</h1>
        <p style="color:var(--forest-500); font-size:.9rem; line-height:1.5; margin:0 0 2.25rem;">Enter your admin email and we will send you a password reset link.</p>
      </div>
      <div id="reset-message"></div>
      <form id="forgot-form">
        <label class="field">Email address<input required type="email" id="reset-email" autocomplete="email" /></label>
        <button type="submit" class="btn btn-primary btn-block" id="reset-submit">Send reset link</button>
      </form>
      <p class="form-footer"><a href="login.html">Back to log in</a></p>
    </main>
  </div>

  <script src="js/env.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/util.js"></script>
  <script>
    document.getElementById("forgot-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = document.getElementById("reset-message");
      const submit = document.getElementById("reset-submit");
      submit.disabled = true;
      try {
        const result = await Api.post("/auth/forgot-password", {
          email: document.getElementById("reset-email").value,
          client: "admin",
        });
        message.innerHTML = `<p class="alert alert-info">${Util.escapeHtml(result.message)}</p>`;
      } catch (err) {
        message.innerHTML = `<p class="alert alert-error">${Util.escapeHtml(err.message)}</p>`;
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>

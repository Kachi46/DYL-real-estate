<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="seal.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <title>DYL Real Estate Services Admin — Log in</title>
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="brand-row">
        <img src="./img/logo.png" alt="Logo" height="32" width="32" />
        <div>
          <p class="name">DYL Real Estate Services</p>
          <p class="tag">Admin console</p>
        </div>
      </div>

      <form id="login-form" style="margin-top:1.5rem;">
        <div id="login-error"></div>
        <label class="field">
          Email
          <input required type="email" id="login-email" />
        </label>
        <label class="field">
          Password
          <input required type="password" id="login-password" />
        </label>
        <button type="submit" class="btn btn-primary btn-block" id="login-submit">Log in</button>
      </form>
    </div>
  </div>

  <script src="js/env.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/util.js"></script>
  <script src="js/connection-check.js"></script>
  <script>
    if (Api.getToken()) window.location.href = "index.html";

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("login-error");
      const submitBtn = document.getElementById("login-submit");
      errorEl.innerHTML = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Logging in…";
      try {
        const res = await Api.post("/auth/login", {
          email: document.getElementById("login-email").value,
          password: document.getElementById("login-password").value,
        });
        if (res.user.role !== "admin") {
          throw new Error("This account does not have admin access.");
        }
        Api.setToken(res.token);
        window.location.href = "index.html";
      } catch (err) {
        errorEl.innerHTML = `<p class="alert alert-error">${Util.escapeHtml(err.message)}</p>`;
        submitBtn.disabled = false;
        submitBtn.textContent = "Log in";
      }
    });
  </script>
</body>
</html>
